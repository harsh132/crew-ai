<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!--
      Both schemes. Declared here as well as in the stylesheet so native
      controls and scrollbars match before it loads.
    -->
    <meta name="color-scheme" content="light dark" />
    <!--
      Stamped before first paint so a remembered dark choice never flashes
      white. The person's pick from the bar's toggle wins; otherwise the
      operating system's. src/lib/theme.ts keeps it current after this.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('crew.theme');
        } catch (error) {}
        if (theme !== 'light' && theme !== 'dark') {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/svg+xml" href="/crewai-mark.svg" />
    <title>Crew AI</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
